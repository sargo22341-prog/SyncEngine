[package]
license.workspace = true
name = "syncengine-desktop"
description = "Native Rust (iced) presentation shell using the SyncEngine application facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "syncengine-desktop"
path = "src/main.rs"

[features]
default = []
sftp = ["sync-orchestrator/sftp"]
webdav = ["sync-orchestrator/webdav"]
ftp = ["sync-orchestrator/ftp"]
ftps = ["sync-orchestrator/ftps"]
smb = ["sync-orchestrator/smb"]
onedrive = ["sync-orchestrator/onedrive"]
network = ["sync-orchestrator/network"]

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "smol"] }
rfd = "0.17.2"
# Notification-area icon; KSNI (D-Bus) backend on Linux: no GTK/AppIndicator.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
sync-orchestrator.workspace = true
sync-profiles.workspace = true
sync-core.workspace = true
sync-filter.workspace = true
sync-plan.workspace = true
sync-scheduler.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Windows executable icon (resource compiled by rc.exe / llvm-rc).
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[lints]
workspace = true
