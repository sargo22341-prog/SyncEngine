[package]
license.workspace = true
name = "syncengine-desktop"
description = "Tauri presentation shell using the SyncEngine application facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
sftp = ["sync-orchestrator/sftp"]
webdav = ["sync-orchestrator/webdav"]
ftp = ["sync-orchestrator/ftp"]
ftps = ["sync-orchestrator/ftps"]
smb = ["sync-orchestrator/smb"]
onedrive = ["sync-orchestrator/onedrive"]
network = ["sync-orchestrator/network"]

default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
sync-orchestrator.workspace = true
sync-profiles.workspace = true
sync-core.workspace = true
sync-scheduler.workspace = true
serde_json.workspace = true

[lints]
workspace = true
