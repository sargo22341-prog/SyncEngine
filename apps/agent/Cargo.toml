[package]
license.workspace = true
name = "syncengine-agent"
description = "Headless scheduled profile execution through the application facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
sftp = ["sync-orchestrator/sftp"]
webdav = ["sync-orchestrator/webdav"]
ftp = ["sync-orchestrator/ftp"]
ftps = ["sync-orchestrator/ftps"]
smb = ["sync-orchestrator/smb"]
onedrive = ["sync-orchestrator/onedrive"]
network = ["sync-orchestrator/network"]

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
sync-scheduler.workspace = true
sync-orchestrator.workspace = true
sync-core.workspace = true
platform-api.workspace = true
platform-windows.workspace = true
platform-linux.workspace = true
serde_json.workspace = true

[dev-dependencies]
sync-profiles.workspace = true
tempfile.workspace = true

[lints]
workspace = true
