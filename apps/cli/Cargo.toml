[package]
license.workspace = true
name = "syncengine-cli"
description = "Interface en ligne de commande de SyncEngine (phase 04 : inventaire, comparaison, prévisualisation de plans de sauvegarde ou de miroir sur dossiers locaux, puis exécution réelle confirmée et journalisée de ces plans ; diagnostic des journaux)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "syncengine"
path = "src/main.rs"

[features]
default = []
sftp = ["sync-orchestrator/sftp"]
webdav = ["sync-orchestrator/webdav"]
ftp = ["sync-orchestrator/ftp"]
ftps = ["sync-orchestrator/ftps"]
smb = ["sync-orchestrator/smb"]
onedrive = ["sync-orchestrator/onedrive"]
network = ["sync-orchestrator/network"]

[dependencies]
sync-orchestrator.workspace = true
ctrlc = { version = "3.5.2", features = ["termination"] }
connector-local.workspace = true
serde_json.workspace = true
sync-backup.workspace = true
sync-compare.workspace = true
sync-core.workspace = true
sync-decisions.workspace = true
sync-events.workspace = true
sync-executor.workspace = true
sync-filter.workspace = true
sync-journal.workspace = true
sync-mirror.workspace = true
sync-plan.workspace = true
sync-scanner.workspace = true
sync-verify.workspace = true
sync-versioning.workspace = true

[dev-dependencies]
blake3.workspace = true
tempfile.workspace = true

[lints]
workspace = true
