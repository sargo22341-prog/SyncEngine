# Contrôles obligatoires (AGENTS.md, section QUALITÉ RUST) sur chaque pull request et chaque
# push sur main, sous Ubuntu et Windows. La chaîne Rust est lue depuis rust-toolchain.toml.
# Sur main : montée de version, archives portables Windows et Linux, commit + tag vX.Y.Z et
# GitHub Release (les deux archives seulement) dont le texte vient de RELEASE_NOTES.md (liste
# vidée dans le commit de version), suivi des empreintes SHA-256.
# Les actions suivent leur tag de version majeure (@v7…) ; les montées majeures se font à la main.
# Fonctionnement, limites et sécurité : docs/DEVELOPPEMENT.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Un changement de documentation seule ne publie pas de nouvelle version.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: Partie de la version à incrémenter
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Contrôles (${{ matrix.os }})
    # Gitea/Forgejo Actions lisent aussi .github/workflows : un miroir n'exécute rien.
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        # Debian n'est pas disponible en runner hébergé : Ubuntu sert de cible
        # Linux de référence ; Debian reste à valider.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Interface native iced : X11/Wayland/xkbcommon sont chargés à l'exécution
      # (dlopen) ; seuls les outils C et OpenSSL (connecteurs TLS) sont requis.
      - name: Prérequis de compilation Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev

      - name: Installer la chaîne Rust épinglée
        run: rustup toolchain install

      - name: Versions
        run: |
          rustc --version
          cargo --version

      - name: Version de livraison et tests des scripts
        working-directory: scripts
        run: |
          python test_release.py
          python test_versioning.py
          python test_state_maintenance.py

      - name: Formatage
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Régressions du listing natif Windows
        if: runner.os == 'Windows'
        run: cargo test -p cap-primitives --lib large_read_dir --locked

      - name: Contrats SFTP, HTTPS, FTP, FTPS et OneDrive sur serveurs éphémères
        run: |
          python -m pip install paramiko==5.1.0 pyftpdlib==2.2.0 pyopenssl==26.4.0
          python scripts/test_phase08_sftp.py
          python scripts/test_phase08_webdav.py
          python scripts/test_phase08_ftp.py
          python scripts/test_phase09_onedrive.py

      - name: Verrou natif partagé avec l'outil de maintenance
        run: |
          binary=target/debug/syncengine
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python scripts/test_state_lock.py --binary "$binary"

      - name: SIGTERM coopératif sur un vrai processus CLI
        if: runner.os == 'Linux'
        run: python scripts/test_signals.py --binary target/debug/syncengine

      - name: Feature flags applicatifs
        run: |
          cargo check -p syncengine-cli -p syncengine-agent -p syncengine-desktop --no-default-features --locked
          cargo check -p sync-orchestrator --no-default-features --features onedrive --locked

      - name: Registre sans providers activés
        run: cargo test -p connector-registry --no-default-features --locked

      - name: Check sans warning
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Documentation sans warning
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

  audit:
    name: Audit des dépendances
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Installer la chaîne Rust épinglée
        run: rustup toolchain install

      - name: Installer cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Une vulnérabilité connue bloque la fusion et la release.
      - name: Audit RustSec (vulnérabilités)
        run: cargo audit

      # Avertissements « unmaintained/unsound » : tout nouvel avis bloque. Seuls
      # les avis transitifs listés ici, sans correctif publié compatible, sont
      # tolérés ; chacun est justifié, avec sa condition de retrait, dans
      # docs/DEVELOPPEMENT.md (section « Avis RustSec tolérés »).
      - name: Audit RustSec (avertissements)
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0253 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372

      # Rappel visible à chaque run des avis tolérés ci-dessus, pour ne pas les oublier.
      - name: Audit RustSec (avis tolérés, rappel)
        continue-on-error: true
        run: |
          if ! cargo audit --deny warnings; then
            echo "::warning::Avis RustSec tolérés encore présents : voir docs/DEVELOPPEMENT.md."
            exit 1
          fi

  build:
    name: Archive ${{ matrix.target }}
    needs: [checks, audit]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prérequis de compilation Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev

      - name: Installer la chaîne Rust épinglée
        run: rustup toolchain install

      # Commit de version local, identique octet pour octet à celui du job de publication
      # (mêmes auteur, dates et contenu) : les binaires portent la version et le commit publiés.
      - name: Préparer le commit de version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: python scripts/versioning.py release "$BUMP" "$RUNNER_TEMP/release-notes.md"

      - name: Compiler GUI, CLI et agent (release, connecteurs réseau et OneDrive)
        run: python scripts/release.py prepare

      - name: Archive portable, notices, empreintes et provenance
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python scripts/release.py portable --bundle target/release/bundle --target "$RELEASE_TARGET"
          python scripts/release.py collect --bundle target/release/bundle --output target/release-candidate --target "$RELEASE_TARGET" --formats portable

      - uses: actions/upload-artifact@v7
        with:
          name: syncengine-${{ matrix.target }}
          path: target/release-candidate/
          if-no-files-found: error

  release:
    name: Montée de version et GitHub Release
    needs: [build]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Deux montées de version en parallèle produiraient le même numéro.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Préparer le commit de version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          python scripts/versioning.py release "$BUMP" "$RUNNER_TEMP/release-notes.md"
          tag="v$(python scripts/release.py check-version)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Le tag $tag existe déjà."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: syncengine-*
          path: ${{ runner.temp }}/artifacts

      # Seules les deux archives sont publiées. Manifeste, inventaires et SHA256SUMS de la
      # collecte servent à la vérification ci-dessous et restent dans les artefacts du run.
      - name: Vérifier les archives et préparer les fichiers publiés
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          DIST: ${{ runner.temp }}/dist
          CHECKSUMS: ${{ runner.temp }}/checksums.md
          VERSION_NAME: ${{ steps.version.outputs.name }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          mkdir "$DIST"
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            dir="$ARTIFACTS/syncengine-$target"
            # Empreintes de la collecte, puis version et commit attendus dans le manifeste.
            (cd "$dir" && sha256sum -c SHA256SUMS)
            python - "$dir/manifest.json" "$VERSION_NAME" "$COMMIT" "$target" <<'EOF'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {"version": sys.argv[2], "commit": sys.argv[3], "target": sys.argv[4], "dirty": False}
          wrong = {key: manifest.get(key) for key, value in expected.items() if manifest.get(key) != value}
          if wrong:
              sys.exit(f"manifest {sys.argv[4]} inattendu : {wrong}")
          names = [artifact["name"] for artifact in manifest["artifacts"]]
          if len(names) != 1:
              sys.exit(f"une seule archive attendue pour {sys.argv[4]} : {names}")
          EOF
            cp "$dir"/SyncEngine_*_"$target".* "$DIST/"
          done
          if [[ $(ls "$DIST" | wc -l) -ne 2 ]]; then
            echo "::error::Exactement deux archives attendues."
            ls -l "$DIST"
            exit 1
          fi
          # Empreintes affichées dans la description de la release (pas de fichier en plus).
          {
            echo "### Empreintes SHA-256"
            echo
            echo '```'
            (cd "$DIST" && sha256sum -- *)
            echo '```'
          } > "$CHECKSUMS"
          ls -l "$DIST"
          cat "$CHECKSUMS"

      - name: Commit et tag de la version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION_NAME" -m "SyncEngine $VERSION_NAME"
          # Atomique : si main a avancé pendant le build, ni le commit ni le tag ne sont poussés.
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION_NAME"

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          DIST: ${{ runner.temp }}/dist
          NOTES: ${{ runner.temp }}/release-notes.md
          CHECKSUMS: ${{ runner.temp }}/checksums.md
          BODY: ${{ runner.temp }}/release-body.md
        run: |
          if [[ -s "$NOTES" ]]; then
            { cat "$NOTES"; echo; cat "$CHECKSUMS"; } > "$BODY"
            notes=(--notes-file "$BODY")
          else
            # Notes générées par GitHub ; --notes (documenté) les fait précéder des empreintes.
            notes=(--notes "$(cat "$CHECKSUMS")" --generate-notes)
          fi
          gh release create "v$VERSION_NAME" "$DIST"/* --title "SyncEngine $VERSION_NAME" "${notes[@]}"
