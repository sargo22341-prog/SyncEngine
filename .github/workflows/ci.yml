# Contrôles obligatoires (AGENTS.md, section QUALITÉ RUST).
# La chaîne Rust est lue depuis rust-toolchain.toml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Contrôles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Debian n'est pas disponible en runner hébergé : Ubuntu sert de cible
        # Linux de référence ; Debian reste à valider (voir docs/ETAT_PROJET.md).
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Prérequis desktop Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Frontend desktop
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build

      - name: Installer la chaîne Rust épinglée
        run: rustup toolchain install

      - name: Versions
        run: |
          rustc --version
          cargo --version

      - name: Formatage
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Contrats SFTP, HTTPS, FTP et FTPS sur serveurs éphémères
        run: |
          python -m pip install paramiko==5.1.0 pyftpdlib==2.2.0 pyopenssl==26.4.0
          python scripts/test_phase08_sftp.py
          python scripts/test_phase08_webdav.py
          python scripts/test_phase08_ftp.py

      - name: Registre sans providers activés
        run: cargo test -p connector-registry --no-default-features --locked

      - name: Check sans warning
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Documentation sans warning
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer la chaîne Rust épinglée
        run: rustup toolchain install

      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit RustSec
        run: cargo audit
