# Private candidate artifacts only; no tag, GitHub Release or public publishing.
name: Release candidate
on:
  workflow_dispatch:
    inputs:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev
      - run: rustup toolchain install
      - name: Release tooling tests
        run: |
          python scripts/test_release.py
          python scripts/test_state_maintenance.py
      - name: Mandatory Rust checks
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo check --workspace --all-targets --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked
          cargo test -p connector-registry --no-default-features --locked
          cargo check -p sync-orchestrator --no-default-features --locked
      - name: Cooperative SIGTERM on a real CLI process
        if: runner.os == 'Linux'
        run: python scripts/test_signals.py --binary target/debug/syncengine
      - name: Isolated provider contracts
        run: |
          python -m pip install paramiko==5.1.0 pyftpdlib==2.2.0 pyopenssl==26.4.0
          python scripts/test_phase08_sftp.py
          python scripts/test_phase08_webdav.py
          python scripts/test_phase08_ftp.py
          python scripts/test_phase09_onedrive.py
      - name: Dependency audits
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Build native GUI, CLI and agent
        run: python scripts/release.py prepare
      # Installers (NSIS, deb, AppImage) were produced by the removed Tauri
      # bundler; a Rust-native packager is a separate packaging step. The
      # candidate is a portable archive of the three binaries.
      - name: Portable archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py portable --bundle target/release/bundle --target "$RELEASE_TARGET"
      - name: Collect checksums and provenance
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py collect --bundle target/release/bundle --output target/release-candidate --target "$RELEASE_TARGET" --formats portable
      - uses: actions/upload-artifact@v4
        with:
          name: syncengine-${{ matrix.target }}
          path: target/release-candidate/
          if-no-files-found: error
