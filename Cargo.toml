[workspace]
resolver = "3"
exclude = ["vendor/suppaftp", "vendor/glib", "vendor/glib-macros", "vendor/gtk3-macros"]
members = [
    "crates/services/sync-credentials",
    "crates/connectors/cloud/connector-onedrive",
    "crates/adapters/connector-registry",
    "crates/connectors/network/connector-ftp-transport",
    "crates/connectors/network/connector-ftp",
    "crates/connectors/network/connector-ftps",
    "crates/connectors/network/connector-smb",
    "crates/adapters/connector-staging",
    "crates/connectors/network/connector-sftp",
    "crates/connectors/network/connector-webdav",
    "crates/services/sync-scheduler",
    "crates/adapters/platform-api",
    "crates/adapters/platform-windows",
    "crates/adapters/platform-linux",
    "apps/agent",

    "apps/desktop/src-tauri",
    "crates/services/sync-profiles",
    "crates/application/sync-orchestrator",
    "crates/strategy/sync-bidirectional",
    "crates/services/sync-history",
    "crates/application/sync-session",
    "crates/foundation/sync-core",
    "crates/foundation/sync-errors",
    "crates/foundation/sync-events",
    "crates/foundation/sync-plan",
    "crates/adapters/connector-api",
    "crates/adapters/connector-local",
    "crates/discovery/sync-filter",
    "crates/discovery/sync-scanner",
    "crates/discovery/sync-compare",
    "crates/strategy/sync-decisions",
    "crates/strategy/sync-backup",
    "crates/strategy/sync-mirror",
    "crates/execution/sync-copy",
    "crates/execution/sync-verify",
    "crates/execution/sync-versioning",
    "crates/execution/sync-journal",
    "crates/execution/sync-executor",
    "tests/support/connector-memory",
    "apps/cli",
    "tests/architecture",
]

[workspace.package]
license = "GPL-3.0-only"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
sync-credentials = { path = "crates/services/sync-credentials" }
connector-ftp-transport = { path = "crates/connectors/network/connector-ftp-transport" }
connector-staging = { path = "crates/adapters/connector-staging" }
suppaftp = { version = "12.1.1", default-features = false, features = ["native-tls"] }
ssh2 = "0.9.6"
reqwest = { version = "=0.13.1", default-features = false, features = ["blocking", "native-tls"] }
roxmltree = "0.21.1"
percent-encoding = "2.3.2"
sync-scheduler = { path = "crates/services/sync-scheduler" }
platform-api = { path = "crates/adapters/platform-api" }
platform-windows = { path = "crates/adapters/platform-windows" }
platform-linux = { path = "crates/adapters/platform-linux" }

sync-profiles = { path = "crates/services/sync-profiles" }
sync-orchestrator = { path = "crates/application/sync-orchestrator" }
sync-bidirectional = { path = "crates/strategy/sync-bidirectional" }
sync-history = { path = "crates/services/sync-history" }
sync-session = { path = "crates/application/sync-session" }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
# Crates internes (option A : liés à la compilation).
sync-core = { path = "crates/foundation/sync-core" }
sync-errors = { path = "crates/foundation/sync-errors" }
sync-events = { path = "crates/foundation/sync-events" }
sync-plan = { path = "crates/foundation/sync-plan" }
connector-api = { path = "crates/adapters/connector-api" }
connector-local = { path = "crates/adapters/connector-local" }
sync-filter = { path = "crates/discovery/sync-filter" }
sync-scanner = { path = "crates/discovery/sync-scanner" }
sync-compare = { path = "crates/discovery/sync-compare" }
sync-decisions = { path = "crates/strategy/sync-decisions" }
sync-backup = { path = "crates/strategy/sync-backup" }
sync-mirror = { path = "crates/strategy/sync-mirror" }
sync-copy = { path = "crates/execution/sync-copy" }
sync-verify = { path = "crates/execution/sync-verify" }
sync-versioning = { path = "crates/execution/sync-versioning" }
sync-journal = { path = "crates/execution/sync-journal" }
sync-executor = { path = "crates/execution/sync-executor" }
# Double de test (stockage mémoire avec injection de pannes) : dev-dependency uniquement.
connector-memory = { path = "tests/support/connector-memory" }

# Dépendances externes : versions épinglées en semver mineur, Cargo.lock versionné.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Phase 02 : motifs de filtre (globs) et empreintes de contenu (choix BLAKE3 de CONTEXTE.md).
globset = { version = "0.4.20", default-features = false }
blake3 = "1.8.7"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
let_underscore_must_use = "warn"

[patch.crates-io]
# SuppaFTP 12.2.1 logs PASS and server replies at TRACE; local minimal redaction.
suppaftp = { path = "vendor/suppaftp" }

# GTK3 ABI remains 0.18; minimal reviewed upstream backport and maintained macros.
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
