[package]
name = "connector-registry"
description = "Factories réseau statiques, filtrées par features à la compilation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[features]
default = []
onedrive = ["dep:connector-onedrive", "dep:sync-credentials"]
sftp = ["dep:connector-sftp"]
webdav = ["dep:connector-webdav"]
ftp = ["dep:connector-ftp"]
ftps = ["dep:connector-ftps"]
smb = ["dep:connector-smb"]
[dependencies]
connector-onedrive = { path = "../../connectors/cloud/connector-onedrive", features = ["onedrive"], optional = true }
sync-credentials = { workspace = true, optional = true }
sync-core.workspace = true
connector-api.workspace = true
connector-sftp = { path = "../../connectors/network/connector-sftp", features=["sftp"],optional=true }
connector-webdav = { path = "../../connectors/network/connector-webdav", features=["webdav"],optional=true }
connector-ftp = { path = "../../connectors/network/connector-ftp", features=["ftp"],optional=true }
connector-ftps = { path = "../../connectors/network/connector-ftps", features=["ftps"],optional=true }
connector-smb = { path = "../../connectors/network/connector-smb", features=["smb"],optional=true }
[lints]
workspace = true
