[package]
license.workspace = true
name = "connector-local"
description = "Connecteur du système de fichiers local (Windows et Linux) : listing, métadonnées, lecture en flux et mutations explicitement activées, sans suivre les liens symboliques ni sortir de la racine configurée."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
connector-api.workspace = true
sync-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# renameat2(RENAME_NOREPLACE) sans `unsafe` ; déjà présent via cap-std.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
# Safe opt-in bulk listing API from our existing reviewed Windows dependency patch.
cap-primitives = "4.0.3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
